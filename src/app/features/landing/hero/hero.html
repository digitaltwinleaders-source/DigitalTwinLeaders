<section id="hero" class="vh-100-h bg-primary d-flex flex-column justify-content-center align-items-center text-center gap-4 position-relative"
    style="background: linear-gradient(rgba(0, 0, 99, 0.45), rgba(0, 0, 99, 0.75)), url('assets/image-2.jpg'); background-size: cover; background-position: center;">
    <div class="max-w-4xl mx-auto" data-aos="fade-up">
        <div class="container pt-3 pt-md-0">
            <app-pill-badge text="Global Professional Community"></app-pill-badge>
            <h1 class="display-1 text-monochrome-100 fw-bold my-3">Where Digital Twin Professionals <span class="text-secondary">Make&nbsp;Their&nbsp;Mark</span></h1>
            <p class="fs-5 fs-md-4 text-monochrome-100 text-opacity-75 mb-4">Stay current, exchange ideas with practitioners around the world, and build your reputation through what you contribute.</p>
            <a class="btn btn-secondary text-monochrome-100 shadow mb-5" routerLink="/membership">Become a Member</a>
            <app-subscribe subscribeButtonText="Get Free Updates" buttonClass="border text-monochrome-100 bg-monochrome-200 bg-opacity-15 hover-bg-opacity-25"/>
            <div class="d-inline-flex align-items-center justify-content-center flex-wrap gap-1 mt-4 mb-5">
                <app-pill-badge text="Founding Rate: $299/Year" [background]="false"></app-pill-badge>
                <app-pill-badge text="Free Digital Twin Content" [background]="false"></app-pill-badge>
                <app-pill-badge text="14-Day Refund" [background]="false"></app-pill-badge>
            </div>
        </div>
    </div>

    <div class="position-absolute bottom-0 left-0 w-100" [ngStyle]="{height: '128px', background: 'linear-gradient(to bottom, rgba(255, 255, 255, 0) 0%, #ffffff 100%)'}"></div>
</section>
