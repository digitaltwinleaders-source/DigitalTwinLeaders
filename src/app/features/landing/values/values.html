<section id="values" class="bg-monochrome-300 bg-opacity-10 border-top border-bottom">
    <div class="container py-5">
        <h2 class="fs-7 text-center text-secondary font-support mb-4">WHY DTL</h2>
        <div class="row justify-content-center">
            @for (card of cardList; track $index) {
                <div class="col-md-4 mb-4 mb-md-0" data-aos="fade-up" attr.data-aos-delay="{{ $index * 150 }}">
                    <div class="d-flex gap-3 align-items-start">
                        <div class="bg-secondary-300 bg-opacity-25 rounded-3 d-flex justify-content-center align-items-center flex-shrink-0" [ngStyle]="{width: '48px', height: '48px'}">
                            <i class="bi bi-{{ card.icon }} text-secondary fs-4" aria-hidden="true"></i>
                        </div>
                        <div>
                            <h3 class="fs-6 fw-bold mb-1">{{ card.title }}</h3>
                            <p class="text-monochrome-500 mb-0 fs-7">{{ card.description }}</p>
                        </div>
                    </div>
                </div>
            }
        </div>
    </div>
</section>
