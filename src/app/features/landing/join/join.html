<section id="join" class="bg-monochrome-300 bg-opacity-10">
    <div class="container py-5">
        <div class="d-flex flex-column justify-content-center my-5">
            <h2 class="text-center display-3 mb-4 fw-bold" data-aos="fade-in">Make Your Mark in <span class="text-secondary">Digital Twins</span></h2>
            <p class="text-center fs-6 fs-md-5 mt-4 w-100 w-md-75 w-xl-50 mx-auto" data-aos="fade-up">Join our network for free digital twin content, member discounts, and first news of what's next, and be part of a growing global community of practitioners.</p>
            <div class="text-center my-3">
                <button class="btn btn-secondary text-monochrome-100 shadow" routerLink="/" fragment="hero" data-aos="fade-in" data-aos-delay="500"><span>Join Our Network</span><i class="bi bi-arrow-right ms-2"></i></button>
            </div>
            <div class="d-inline-flex align-items-center justify-content-center flex-wrap gap-1 mt-4">
                <app-pill-badge text="Free to Join" [background]="false" color="dark" dot="success"></app-pill-badge>
                <app-pill-badge text="Member Discounts" [background]="false" color="dark" dot="success"></app-pill-badge>
                <app-pill-badge text="First to Know" [background]="false" color="dark" dot="success"></app-pill-badge>
            </div>
        </div>
    </div>
</section>
