<section id="about" class="position-relative">
    <div class="container py-5">
        <div class="my-5 max-w-3xl mx-auto">
            <p class="text-center text-secondary mb-3 font-support fs-7" data-aos="fade-up">WHAT YOU GET</p>
            <h2 class="text-center display-3 mb-4 fw-bold" data-aos="fade-up">Practical tools, real visibility, the right peers</h2>
        </div>

        <div class="row my-5">
            @for (card of cardList; track $index) {
                <div class="col-md-4 mb-4" data-aos="fade-up" attr.data-aos-delay="{{ $index * 150 }}">
                    <div class="bg-white h-100 rounded-4 border border-1 shadow-sm p-4">
                        <div class="bg-secondary-300 bg-opacity-25 rounded-3 d-flex justify-content-center align-items-center mb-4" [ngStyle]="{width: '56px', height: '56px'}">
                            <i class="bi bi-{{ card.icon }} fs-3 text-secondary" aria-hidden="true"></i>
                        </div>
                        <h3 class="fs-5 fw-bold mb-3">{{ card.title }}</h3>
                        <p class="text-monochrome-500 mb-0 fs-6">{{ card.description }}</p>
                    </div>
                </div>
            }
        </div>
    </div>
</section>
