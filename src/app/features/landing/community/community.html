<section id="community">
    <div class="container py-5">
        <div class="my-5 max-w-3xl mx-auto" data-aos="fade-up">
            <p class="text-secondary mb-3 font-support fs-7">WHO IT'S FOR</p>
            <h2 class="fs-1 mb-4 fw-bold">Built for people who deliver digital twins</h2>
            <p class="fs-6 fs-md-5 mb-4">Engineers, planners, GIS specialists, asset managers and consultants working on real digital twin initiatives.</p>
            <ul class="list-unstyled d-flex flex-wrap gap-2 mb-0">
                @for (item of industries; track item) {
                    <li class="bg-secondary-400 bg-opacity-50 text-primary rounded-4 py-1 px-3 fs-7">{{ item }}</li>
                }
            </ul>
        </div>
    </div>
</section>
